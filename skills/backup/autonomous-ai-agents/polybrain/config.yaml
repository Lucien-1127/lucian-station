# PolyBrain Configuration
models:
  orchestrator: "custom/agnes-2.0-flash"
  researcher: "custom/agnes-2.0-flash"
  builder: "custom/agnes-2.0-flash"
  synthesizer: "custom/agnes-2.0-flash"
  verifier: "custom/agnes-2.0-flash"
  fallback: "custom/agnes-2.0-flash"

providers:
  orchestrator: "custom"
  researcher: "custom"
  builder: "custom"
  synthesizer: "custom"
  verifier: "custom"
  fallback: "custom"

toolsets:
  researcher: ["web", "browser"]
  builder: ["terminal", "file"]
